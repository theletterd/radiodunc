<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RadioDunc</title>
  <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <div class="wrap" id="wrap" data-mode="default">
    <aside id="sidebar">
      <!-- Default sidebar content -->
      <div class="sidebar-view sidebar-default">
        <div id="libraryStatus" class="library-status muted">
          <span id="libTrackCount">— tracks</span>
          <span id="libLastScan"></span>
        </div>

        <button id="openSchedulerBtn" class="sidebar-action">
          <span class="emoji">📅</span> The Schedule
        </button>

        <details>
          <summary>Library Setup</summary>
          <div class="card">
            <label class="muted" for="libraryPath" style="display:block; margin-bottom:6px; font-size:0.8rem;">Music folder</label>
            <input id="libraryPath" placeholder="/path/to/music" />
            <div class="row" style="margin-top:10px;">
              <button id="scanBtn" class="primary">Scan Library</button>
            </div>
            <p id="scanStatus" class="status muted">Idle</p>
          </div>
        </details>
      </div>

      <!-- Scheduler view (sidebar expands when this is shown) -->
      <div class="sidebar-view sidebar-scheduler" data-sub-view="grid">
        <div class="scheduler-header">
          <h2 class="scheduler-title">📅 The Schedule</h2>
          <button id="closeSchedulerBtn" class="icon-button" title="Collapse schedule">‹</button>
        </div>

        <!-- Grid sub-view -->
        <div class="scheduler-grid-view">
          <div id="scheduleLegend" class="schedule-legend"></div>
          <div id="scheduleGrid" class="schedule-grid"></div>
          <div class="row" style="margin-top:14px; justify-content:space-between;">
            <button id="addPersonaBtn" class="primary">+ New persona</button>
            <span class="muted" style="font-size:0.72rem;">Click a block to edit</span>
          </div>
        </div>

        <!-- Edit sub-view -->
        <div class="scheduler-edit-view">
          <button id="backToGridBtn" class="icon-button" style="margin-bottom:12px;">← Back</button>
          <form id="personaForm" class="persona-form" autocomplete="off"></form>
        </div>
      </div>
    </aside>

    <main>
      <h1 id="stationName">RadioDunc</h1>
      <p id="stationMeta">Your personal AI radio station.</p>

      <div class="card">
        <div class="row">
          <button id="playBtn" class="primary">Play</button>
          <button id="nextBtn">Next</button>
          <button id="stopBtn">Stop</button>
          <label>Volume <input id="volume" type="range" min="0" max="100" value="80" /></label>
        </div>
      </div>

      <div class="card now-playing" id="nowPlayingCard">
        <h3>Now Playing</h3>
        <div class="now-playing-clip">
          <p id="nowPlaying">-</p>
        </div>
        <p id="nowPlayingFile" class="muted" style="font-size:0.8rem; margin:0; font-family: monospace;"></p>
        <p id="playerFlags" class="muted">-</p>
      </div>

      <div class="card">
        <h3>Up Next</h3>
        <ul id="queueList"></ul>
      </div>

      <div class="card">
        <h3>Request a Track</h3>
        <input type="text" id="trackSearch" placeholder="Search the library…" />
        <ul id="searchResults" style="margin-top:6px;"></ul>
      </div>

    </main>
  </div>

<script src="/ui/app.js"></script>
</body>
</html>
