<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RadioDunc</title>
  <link rel="icon" type="image/svg+xml" href="/ui/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <div class="wrap" id="wrap" data-mode="default">
    <aside id="sidebar">
      <!-- Default sidebar content -->
      <div class="sidebar-view sidebar-default">
        <div id="libraryStatus" class="library-status muted">
          <span id="libTrackCount">— tracks</span>
          <span id="libLastScan"></span>
        </div>

        <button id="openSchedulerBtn" class="sidebar-action">
          <span class="emoji">📅</span> The Schedule
        </button>

        <button id="openRosterBtn" class="sidebar-action">
          <span class="emoji">🎙</span> DJ Roster
        </button>

        <button id="openSettingsBtn" class="sidebar-action">
          <span class="emoji">⚙</span> Station Settings
        </button>

        <details>
          <summary>Library Setup</summary>
          <div class="card">
            <label class="muted" for="libraryPath" style="display:block; margin-bottom:6px; font-size:0.8rem;">Music folder</label>
            <input id="libraryPath" placeholder="/path/to/music" />
            <div class="row" style="margin-top:10px;">
              <button id="scanBtn" class="primary">Scan Library</button>
            </div>
            <p id="scanStatus" class="status muted">Idle</p>
          </div>
        </details>
      </div>

      <!-- Scheduler view (sidebar expands when this is shown) -->
      <div class="sidebar-view sidebar-scheduler" data-sub-view="grid">
        <div class="scheduler-header">
          <h2 class="scheduler-title">📅 The Schedule</h2>
          <button id="closeSchedulerBtn" class="icon-button" title="Collapse schedule">‹</button>
        </div>

        <!-- Grid sub-view -->
        <div class="scheduler-grid-view">
          <div id="scheduleLegend" class="schedule-legend"></div>
          <div id="scheduleGrid" class="schedule-grid"></div>
          <div class="row" style="margin-top:14px; justify-content:space-between;">
            <button id="addShowBtn" class="primary">+ New show</button>
            <span class="muted" style="font-size:0.72rem;">Click a block to edit</span>
          </div>
        </div>

        <!-- Edit sub-view -->
        <div class="scheduler-edit-view">
          <button id="backToGridBtn" class="icon-button" style="margin-bottom:12px;">← Back</button>
          <!-- Deliberately NOT a <form>. Password managers (LastPass in
               particular) scan <form> elements for autofillable fields and
               will attach their UI to inputs inside, even with every documented
               opt-out attribute set. A plain <div> with a button-driven save
               (wired up in JS via click, not submit) sidesteps the heuristic
               entirely. -->
          <div id="showForm" class="persona-form" role="group"
               aria-label="Edit show"></div>
        </div>

        <!-- Inline DJ-create modal — opens over the Show editor when the user
             picks "+ Create new DJ…" from the DJ picker. Hidden by default;
             JS toggles its `.open` class. Preserves the in-progress Show
             edits underneath. Slice 6 will introduce the full DJ Roster
             takeover with a richer editor; this modal is the minimal subset
             needed to keep the Show flow moving. -->
        <div id="djCreateModal" class="dj-create-modal" role="dialog"
             aria-label="Create new DJ" aria-modal="true"></div>
      </div>

      <!-- DJ Roster view (sidebar takeover, parallel to the scheduler) -->
      <div class="sidebar-view sidebar-roster" data-sub-view="list">
        <div class="scheduler-header">
          <h2 class="scheduler-title">🎙 DJ Roster</h2>
          <button id="closeRosterBtn" class="icon-button" title="Close roster">‹</button>
        </div>

        <!-- List sub-view: one row per DJ + "+ New DJ" -->
        <div class="roster-list-view">
          <div id="rosterList" class="roster-list"></div>
          <div class="row" style="margin-top:14px;">
            <button id="addDjBtn" class="primary">+ New DJ</button>
          </div>
        </div>

        <!-- Edit sub-view: the DJ editor form -->
        <div class="roster-edit-view">
          <button id="backToRosterBtn" class="icon-button" style="margin-bottom:12px;">← Back</button>
          <!-- No <form> tag for the same anti-LastPass reason the show form
               carries; save is wired up in JS via click, not submit. -->
          <div id="djEditorForm" class="persona-form" role="group"
               aria-label="Edit DJ"></div>
        </div>
      </div>

      <!-- Station settings view (sidebar takeover, like the scheduler) -->
      <div class="sidebar-view sidebar-settings">
        <div class="scheduler-header">
          <h2 class="scheduler-title">⚙ Station Settings</h2>
          <button id="closeSettingsBtn" class="icon-button" title="Close settings">‹</button>
        </div>
        <!-- Form is rendered into here by _renderSettingsForm(). Same anti-LP
             rationale as the persona form: a plain <div>, no <form> tag,
             button-driven save wired up in JS. -->
        <div id="settingsForm" class="settings-form" role="group"
             aria-label="Station settings"></div>
      </div>
    </aside>

    <main>
      <h1 id="stationName">RadioDunc</h1>
      <p id="stationMeta">Your personal AI radio station.</p>

      <div class="card">
        <div class="row">
          <button id="playBtn" class="primary">Play</button>
          <button id="nextBtn">Next</button>
          <button id="stopBtn">Stop</button>
          <label>Volume <input id="volume" type="range" min="0" max="100" value="80" /></label>
        </div>
      </div>

      <div class="card now-playing" id="nowPlayingCard">
        <h3>Now Playing</h3>
        <div class="now-playing-clip">
          <p id="nowPlaying">-</p>
        </div>
        <p id="nowPlayingFile" class="muted" style="font-size:0.8rem; margin:0; font-family: monospace;"></p>
        <p id="playerFlags" class="muted">-</p>
        <canvas id="analyser" class="analyser" aria-hidden="true"></canvas>
        <div class="progress-row">
          <span class="progress-time" id="progressElapsed">0:00</span>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="progress-time" id="progressTotal">0:00</span>
        </div>
      </div>

      <div class="card">
        <h3>Up Next</h3>
        <ul id="queueList"></ul>
      </div>

      <div class="card">
        <h3>Request a Track</h3>
        <input type="text" id="trackSearch" placeholder="Search the library…" />
        <ul id="searchResults" style="margin-top:6px;"></ul>
      </div>

    </main>
  </div>

<div id="trackCard" class="track-card" hidden></div>

<script src="/ui/app.js"></script>
</body>
</html>
