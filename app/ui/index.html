<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RadioDunc — Local Radio Control</title>
    <link rel="stylesheet" href="/ui/styles.css" />

</head>
<body>
  <div class="wrap">
    <aside>
      <h2>Library Setup</h2>
      <div class="card">
        <label class="muted" for="libraryPath">Music folder</label>
        <input id="libraryPath" placeholder="/path/to/music" />
        <div class="row" style="margin-top:10px;">
          <button id="scanBtn" class="primary">Scan Library</button>
          <button id="refreshStationsBtn">Refresh Stations</button>
        </div>
        <p id="scanStatus" class="status muted">Idle</p>
      </div>

      <h2>Stations</h2>
      <input id="search" placeholder="Search stations" style="width:100%; margin-bottom:8px;" />
      <div id="stations"></div>
    </aside>

    <main>
      <h1 id="stationName">No station selected</h1>
      <p id="stationMeta" class="muted">Pick a station, then press Play.</p>

      <div class="card">
        <div class="row">
          <button id="playBtn" class="primary">Play</button>
          <button id="nextBtn">Next</button>
          <button id="stopBtn">Stop</button>
          <label>Volume <input id="volume" type="range" min="0" max="100" value="80" /></label>
        </div>
      </div>

      <div class="card">
        <h3>Now Playing</h3>
        <p id="nowPlaying">-</p>
        <p id="playerFlags" class="muted">-</p>
      </div>

      <div class="card">
        <h3>Live Stream</h3>
        <p id="upNext">Live HLS broadcast</p>
        <audio id="playerAudio" controls style="width:100%; margin-top:8px;"></audio>
        <audio id="overlayAudio" style="display:none;"></audio>
      </div>

      <div class="card">
        <h3>Favorites</h3>
        <p id="favorites" class="muted">-</p>
        <h3>Recent Stations</h3>
        <p id="recent" class="muted">-</p>
      </div>
    </main>
  </div>

<script src="/ui/app.js"></script>

</body>
</html>
