<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="4" fill="#1a1a2e"/>
  <!-- Radio waves emanating from center-left dot -->
  <!-- Inner wave -->
  <path d="M13 10 A8 8 0 0 1 13 22" fill="none" stroke="#e879a0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Middle wave -->
  <path d="M10 7 A13 13 0 0 1 10 25" fill="none" stroke="#e879a0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Outer wave -->
